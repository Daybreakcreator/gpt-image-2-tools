# 把站点作为资源 Worker 部署到 image.markxian.cn 所在的同名 worker，
# 域名原地保留、无需改 DNS、零中断。部署：npx wrangler deploy -c wrangler.image.toml
name = "gpt-image-2"
main = "worker/image-worker.js"
compatibility_date = "2026-09-04"
routes = [{ pattern = "image.markxian.cn", custom_domain = true }]
assets = { directory = "./dist", binding = "ASSETS" }

# 匿名生成计数（只存一个整数）
[[kv_namespaces]]
binding = "COUNTER"
id = "ef014e9665c34afc837ce37f6997344c"
preview_id = "0740a8d581aa4c15be9704b55b8cc16c"
